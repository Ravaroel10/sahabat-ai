services:
  ai-service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the host's ./data/chroma into the container so local
      # `py -m ingest.ingest` and the Docker-deployed service share the
      # SAME ChromaDB instance. Previously this used a named volume
      # (`chroma-data:/data`) which silently diverged: ingest wrote to
      # the host filesystem while the app read from the Docker volume,
      # and the LLM saw zero RAG hits even after a "successful" ingest.
      - ./data/chroma:/data/chroma
      - ../src/data:/app/src/data:ro
    env_file:
      - .env
    environment:
      - CHROMA_PATH=/data/chroma
      - FRONTEND_URL=http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

# Note: the named `chroma-data` volume was removed. If you previously
# ingested data into the named volume (e.g., in a prior deployment),
# that data is still on disk under the Docker volume name but is no
# longer accessible to the app. To migrate it: stop the stack, run
# `docker volume inspect chroma-data` to find the mountpoint, copy the
# contents to ai-service/data/chroma/ on the host, then bring the
# stack back up.
